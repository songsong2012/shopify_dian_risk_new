<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 电商风控管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif; background: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 12px; padding: 36px 40px; width: 360px; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  .card h1 { font-size: 20px; color: #111827; margin-bottom: 6px; }
  .card .sub { font-size: 13px; color: #6b7280; margin-bottom: 24px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: #374151; margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
  .field input:focus { border-color: #2563eb; }
  .btn { width: 100%; padding: 11px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 6px; }
  .btn:disabled { background: #93c5fd; cursor: not-allowed; }
  .err { color: #dc2626; font-size: 13px; margin-top: 12px; min-height: 18px; }
</style>
</head>
<body>
<div class="card">
  <h1>电商风控管理</h1>
  <div class="sub">e-commerce risk management · 管理员登录</div>
  <form onsubmit="return doLogin(event)">
    <div class="field">
      <label>用户名</label>
      <input type="text" id="username" required autocomplete="username">
    </div>
    <div class="field">
      <label>密码</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button class="btn" id="btn" type="submit">登 录</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
async function doLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  btn.disabled = true; btn.textContent = '登录中...';
  document.getElementById('err').textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const d = await r.json();
    if (d.ok) {
      location.href = '/dashboard';
    } else {
      document.getElementById('err').textContent = d.error || '用户名或密码错误';
    }
  } catch (ex) {
    document.getElementById('err').textContent = '网络错误：' + ex.message;
  }
  btn.disabled = false; btn.textContent = '登 录';
  return false;
}
</script>
</body>
</html>
